; PlatformIO Project Configuration
; Dashboard Web Embarcado — ESP8266 (NodeMCU V2 / ESP8266MOD)
; Spec: .specs/features/dashboard-esp8266/spec.md

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_flags =
    -Wall
    -Wextra

; Ambiente para testes HOST (lógica pura, sem hardware)
[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -Itest/stubs
build_src_filter =
    -<../src/*>
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
