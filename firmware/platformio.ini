; PlatformIO — Sistema de Monitoramento e Controle Térmico (NodeMCU v2 / ESP8266)
; Versões fixadas por ADR-008 (NFR-005). Comandos em AGENTS.md §4.
; Envs: nodemcuv2 (produção, default) · bancada (injeção serial, FR-030) · native (testes HOST)

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
; lwIP 1460 (ADR-012): o default (MSS 536 / sndbuf ~1 KB) engasava/truncava o envio
; da página de ~12,9 KB e suspendia a amostragem (evidência de bancada 2026-09-12).
build_flags = -std=gnu++17 -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    onewire@2.3.8
    dallastemperature@3.11.0

[env:bancada]
; Bancada: habilita o console de injeção (não existe em produção — ADR-007).
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DBENCH_TEMP_INJECTION=1

[env:native]
; Testes HOST (Unity) da lógica pura — sem SDK, sem hardware.
platform = native
build_flags = -std=gnu++17
test_framework = unity
